<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReliefReady – Smart Disaster Relief Allocation</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--tx:#14213d;--mut:#64748b;--bd:#e2e8f0;--side:#0f1b33;--g:#16a34a;--o:#f59e0b;--r:#dc2626;--b:#2563eb;--map:#e8f0f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#152036;--tx:#e6ecf7;--mut:#94a3b8;--bd:#263450;--map:#101c30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#152036;--tx:#e6ecf7;--mut:#94a3b8;--bd:#263450;--map:#101c30;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body{height:100%}#app{display:flex;min-height:100%}
nav{width:210px;background:var(--side);color:#cbd5e1;padding:16px 10px;flex-shrink:0}
nav h1{font-size:17px;color:#fff;margin:0 8px 2px}nav small{margin:0 8px 14px;display:block;color:#7b8cab;font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:#223458;color:#fff}nav button:hover{background:#1b2c4b}
main{flex:1;padding:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}.top h2{margin:0;font-size:20px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--b);color:#fff;font-size:13px}.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--r)}.btn.or{background:var(--o);color:#111}.btn.act{outline:3px solid var(--g)}
.grid{display:grid;gap:12px}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}.card h3{margin:0 0 10px;font-size:15px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:12px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}tr.sel{background:rgba(37,99,235,.12)}tr[onclick]{cursor:pointer}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}.Critical,.Delivery,.bad{background:var(--r)}.High,.Partially{background:var(--o);color:#111}.Medium{background:var(--b)}.Low,.Fully,.ok{background:var(--g)}.Unmet{background:#7f1d1d}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;width:78px;font-size:13px}select{width:auto}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bar>i{width:92px;font-style:normal;flex-shrink:0;overflow:hidden;text-overflow:ellipsis}.bar>div{flex:1;background:var(--bd);height:14px;border-radius:7px;overflow:hidden;display:flex}.bar>div>u{display:block;height:100%}.bar>em{width:70px;font-style:normal;color:var(--mut);text-align:right}
.up{color:var(--g);font-weight:700}.dn{color:var(--r);font-weight:700}.note{color:var(--mut);font-size:12px}ul{margin:6px 0;padding-left:18px}
textarea{width:100%;height:120px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;font:12px monospace}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap;gap:2px;padding:8px}nav h1,nav small{display:none}nav button{width:auto;padding:7px 9px;font-size:12px}}
@media print{nav,.top div{display:none!important}main{padding:0}body{background:#fff;color:#000}}
</style></head><body><div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const URG={Critical:100,High:75,Medium:50,Low:25};
const V0=[
{id:'A',name:'Lakshmipura',pop:300,food:150,water:250,urg:'Critical',vul:40,dist:18,open:true,x:150,y:90},
{id:'B',name:'Rampura',pop:200,food:100,water:150,urg:'High',vul:25,dist:12,open:true,x:440,y:80},
{id:'C',name:'Devapura',pop:150,food:80,water:120,urg:'Medium',vul:10,dist:8,open:true,x:215,y:225},
{id:'D',name:'Hosahalli',pop:250,food:120,water:200,urg:'Critical',vul:35,dist:25,open:false,x:540,y:190},
{id:'E',name:'Kallur',pop:100,food:50,water:80,urg:'Low',vul:5,dist:5,open:true,x:350,y:265}];
const NEWV={id:'F',name:'Shivapura',pop:350,food:180,water:250,urg:'Critical',vul:60,dist:30,open:true,x:60,y:215};
const DEPOT={x:300,y:335};
let S={view:'Overview',sel:'A',gen:false,sort:'score',sc:{road:false,new:false,stock:false,flood:false},iv:{truck:0,food:0,water:0,restore:[]},method:'greedy',tc:1000,obj:'cov',demo:null,vs:JSON.parse(JSON.stringify(V0)),st:{food:400,water:600,cap:1000}};
const PAGES=['Overview','Live Situation','Resource Allocation','Strategy Comparison','Humanitarian Impact','Route Management','Scenario Simulator','Strategic Simulator','Why This Decision','Reports'];
const $=s=>document.getElementById(s),f0=n=>Math.round(n);

function computeG(vs,st){
 const mp=Math.max(...vs.map(v=>v.pop)),mv=Math.max(...vs.map(v=>v.vul));
 const rows=vs.map(v=>{const u=URG[v.urg],p=v.pop/mp*100,q=v.vul/mv*100;return{v,u,p,q,score:.4*u+.3*p+.3*q,f:0,w:0}});
 rows.sort((a,b)=>b.score-a.score);rows.forEach((r,i)=>r.rank=i+1);
 let F=st.food,W=st.water,C=st.cap;
 rows.forEach(r=>{const v=r.v;r.note='';
  if(!v.open){r.status='Delivery Blocked';r.note='Road blocked – no alternative delivery method available, nothing loaded.';return}
  let f=Math.min(v.food,F),w=Math.min(v.water,W),kg=f*.5+w;
  if(kg>C){const k=C/kg;f=Math.floor(f*k);w=Math.floor(w*k);r.note='Truck capacity limited the load. '}
  F-=f;W-=w;C-=f*.5+w;r.f=f;r.w=w;
  r.status=(f==v.food&&w==v.water)?'Fully Fulfilled':(f+w==0?'Unmet':'Partially Fulfilled');
  if(r.status=='Partially Fulfilled'&&!r.note)r.note='Stock ran out after higher-priority villages were served. ';
  if(r.status=='Unmet')r.note='Stock exhausted by higher-priority villages.';
  if(r.status=='Fully Fulfilled')r.note='Full request met from remaining stock.';});
 const rq=rows.reduce((a,r)=>a+r.v.food+r.v.water,0),al=rows.reduce((a,r)=>a+r.f+r.w,0);
 return{rows,F,W,kgUsed:st.cap-C,cov:rq?al/rq*100:0,fa:st.food-F,wa:st.water-W,st};
}
const WF=1,WW=1;
function metrics(P){let cq=0,ca=0,vT=0,vC=0,cu=0,ws=0;
 P.rows.forEach(r=>{const v=r.v,fs=v.food-r.f,wsh=v.water-r.w;ws+=r.score/100*(WF*fs/v.food+WW*wsh/v.water);vT+=v.vul;vC+=v.vul*fp(r)/100;if(v.urg=='Critical'){cq+=v.food+v.water;ca+=r.f+r.w;cu+=fs+wsh}});
 return Object.assign(P,{ws,vulT:vT,vulC:vC,vulU:vT-vC,cu,critFul:cq?ca/cq*100:100,popT:P.rows.reduce((a,r)=>a+r.v.pop,0)})}
/* Exact integer optimizer: for X packets of food the best split is fractional-knapsack greedy by priority/request; water gets the remaining truck weight. All X are enumerated, so the optimum is exact (not MILP). */
function opt(rows,st){const el=rows.filter(r=>r.v.open);
 const gain=(k,cap)=>{const o=[...el].sort((a,b)=>b.score/b.v[k]-a.score/a.v[k]||a.rank-b.rank);let left=cap,out={},g=0;o.forEach(r=>{const q=Math.min(r.v[k],Math.max(0,left));out[r.v.id]=q;left-=q;g+=r.score/100*q/r.v[k]});return{out,g}};
 const td=el.reduce((a,r)=>a+r.v.food,0),xm=Math.max(0,Math.min(st.food,Math.floor(2*st.cap),td));let best=null;
 for(let X=0;X<=xm;X++){const Y=Math.max(0,Math.min(st.water,Math.floor(st.cap-X*.5))),a=gain('food',X),b=gain('water',Y),g=a.g+b.g;if(!best||g>best.g+1e-9)best={g,a:a.out,b:b.out}}
 rows.forEach(r=>{r.f=best&&best.a[r.v.id]||0;r.w=best&&best.b[r.v.id]||0})}
function compute(vs,st,m){const P=computeG(vs,st);if(m=='opt')opt(P.rows,st);
 let F=st.food,W=st.water,rq=0,al=0;
 P.rows.forEach(r=>{const v=r.v;F-=r.f;W-=r.w;rq+=v.food+v.water;al+=r.f+r.w;
  if(!v.open){r.status='Delivery Blocked';r.note='Road blocked – no normal truck delivery; see recommended actions on Route Management.'}
  else{r.status=(r.f==v.food&&r.w==v.water)?'Fully Fulfilled':(r.f+r.w==0?'Unmet':'Partially Fulfilled');if(m=='opt')r.note=r.status=='Fully Fulfilled'?'Full request met.':'Optimizer accepted this shortage to minimize total weighted shortage.'}});
 P.F=F;P.W=W;P.fa=st.food-F;P.wa=st.water-W;P.kgUsed=P.fa*.5+P.wa;P.cov=rq?al/rq*100:0;P.m=m||'greedy';return metrics(P)}
const IV0=()=>({truck:0,food:0,water:0,restore:[]}),nb=()=>{const s=scen(IV0());return compute(s.vs,s.st,S.method)};
const ivEval=iv=>{const s=scen(iv);return compute(s.vs,s.st,S.method)};
function ivCands(){const bl=scen(IV0()).vs.filter(v=>!v.open),c=[{n:'Additional truck (+'+S.tc+' kg)',iv:{...IV0(),truck:S.tc},rq:'1 truck, '+S.tc+' kg'}];
 [50,100,200].forEach(x=>c.push({n:'+'+x+' food packets',iv:{...IV0(),food:x},rq:x+' food packets'}));[100,200,300].forEach(x=>c.push({n:'+'+x+' L water',iv:{...IV0(),water:x},rq:x+' L water'}));
 bl.forEach(v=>c.push({n:'Restore road to '+v.name,iv:{...IV0(),restore:[v.id]},rq:'Road clearance work'}));return c}
const OBJ={cov:['Overall fulfillment',P=>P.cov],crit:['Critical unmet demand reduction',P=>-P.cu],vul:['Vulnerable people covered',P=>P.vulC]};
function ivRank(){const b=nb(),f=OBJ[S.obj][1];return ivCands().map(c=>{const A=ivEval(c.iv);return{...c,A,b,d:f(A)-f(b)}}).sort((x,y)=>y.d-x.d)}
function vCmp(){const G=cur('greedy'),O=cur('opt'),M=[['Food allocated (packets)',P=>P.fa],['Water allocated (L)',P=>P.wa],['Total truck weight (kg)',P=>P.kgUsed.toFixed(0)],['Overall fulfillment %',P=>P.cov.toFixed(1)],['Critical village fulfillment %',P=>P.critFul.toFixed(1)],['Vulnerable people served (est.)',P=>P.vulC.toFixed(0)],['Critical unmet demand (units)',P=>P.cu],['Total weighted shortage',P=>P.ws.toFixed(3)]];
 const dl=G.ws-O.ws,v=Math.abs(dl)<1e-6?'Both strategies reach the same weighted shortage ('+G.ws.toFixed(3)+'), so here the greedy plan is already optimal for this objective.':'Optimized allocation performs better: weighted shortage falls by '+dl.toFixed(3)+' ('+(dl/G.ws*100).toFixed(1)+'%) versus greedy.';
 const mx=Math.max(G.ws,O.ws)||1;
 return `<div class="card"><h3>Allocation Strategy Comparison</h3><p><b>${v}</b></p><div class="wrap"><table><tr><th>Metric</th><th>Greedy</th><th>Optimized</th></tr>${M.map(m=>`<tr><td>${m[0]}</td><td>${m[1](G)}</td><td>${m[1](O)}</td></tr>`).join('')}</table></div><div class="note">Objective: minimize Σ (priority/100) × (food shortage ÷ food request + water shortage ÷ water request), equal food and water weights, over all villages (blocked villages count as full shortage). Active strategy: ${S.method=='opt'?'Optimized':'Greedy'}.</div></div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Fulfillment % by village</h3>${G.rows.map(g=>{const o=O.rows.find(x=>x.v.id==g.v.id);return hb(g.v.name,fp(g),100,'#f59e0b',fp(g).toFixed(0)+'% greedy')+hb('',fp(o),100,'#16a34a',fp(o).toFixed(0)+'% opt.')}).join('')}</div><div class="card"><h3>Strategy totals</h3>${hb('Greedy shortage',G.ws,mx,'#f59e0b',G.ws.toFixed(3))}${hb('Optimized shortage',O.ws,mx,'#16a34a',O.ws.toFixed(3))}${hb('Greedy fulfil.',G.cov,100,'#f59e0b',G.cov.toFixed(1)+'%')}${hb('Optimized fulfil.',O.cov,100,'#16a34a',O.cov.toFixed(1)+'%')}${hb('Greedy critical',G.critFul,100,'#f59e0b',G.critFul.toFixed(1)+'%')}${hb('Optimized critical',O.critFul,100,'#16a34a',O.critFul.toFixed(1)+'%')}<p class="note">Note: the optimizer minimizes weighted shortage; it may serve a lower-priority village fully if that reduces the total.</p></div></div>`}
function vEq(){const P=cur(),R_=P.rows,fl=R_.map(fp),sp=Math.max(...fl)-Math.min(...fl),lv=sp<20?['Balanced','ok']:sp<50?['Moderate gap','High']:['Severe gap','bad'],cr=R_.filter(r=>r.v.urg=='Critical'&&r.status!='Fully Fulfilled').length;
 return `<div class="grid g6">${[['Affected population',P.popT],['Vulnerable people',P.vulT],['Vulnerable covered (est.)',P.vulC.toFixed(0)],['Vulnerable underserved',P.vulU.toFixed(0)],['Critical villages with unmet needs',cr],['Overall fulfillment',P.cov.toFixed(1)+'%']].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Equity indicator <span class="pill ${lv[1]}">${lv[0]}</span></h3><p>Fulfillment ranges from ${Math.min(...fl).toFixed(0)}% to ${Math.max(...fl).toFixed(0)}% across villages (spread ${sp.toFixed(0)} points). ${R_.filter(r=>fp(r)<50).length} village(s) are below 50% fulfillment${R_.filter(r=>fp(r)<50).length?': '+R_.filter(r=>fp(r)<50).map(r=>r.v.name).join(', '):''}.</p><p class="note">Coverage estimate = vulnerable people × share of the village’s requested units delivered. It is based on simulated demand and allocation, not a verified count of individual recipients.</p></div>
 <div class="card"><h3>Priority vs fulfillment</h3><svg viewBox="0 0 320 220" style="width:100%"><line x1="30" y1="190" x2="310" y2="190" stroke="var(--mut)"/><line x1="30" y1="10" x2="30" y2="190" stroke="var(--mut)"/>${R_.map(r=>{const x=30+r.score/100*250,y=190-fp(r)/100*170;return `<circle cx="${x}" cy="${y}" r="7" fill="${UC[r.v.urg]}"/><text x="${x+9}" y="${y+4}" font-size="10" fill="var(--tx)">${r.v.name}</text>`}).join('')}<text x="170" y="210" font-size="10" text-anchor="middle" fill="var(--mut)">Priority score →</text><text x="4" y="100" font-size="10" fill="var(--mut)" transform="rotate(-90 8 100)">Fulfillment %</text></svg></div></div>
 <div class="card" style="margin-top:12px"><h3>Village-wise outcomes</h3><div class="wrap"><table><tr><th>Village</th><th>Priority</th><th>Fulfillment</th><th>Vulnerable</th><th>Covered (est.)</th><th>Status</th></tr>${R_.map(r=>`<tr><td>${r.v.name}</td><td>${r.score.toFixed(1)}</td><td>${fp(r).toFixed(0)}%</td><td>${r.v.vul}</td><td>${(r.v.vul*fp(r)/100).toFixed(0)}</td><td>${pill(r.status)}</td></tr>`).join('')}</table></div></div>`}
function req(iv){return [iv.truck&&'+'+iv.truck+' kg truck',iv.food&&'+'+iv.food+' packets',iv.water&&'+'+iv.water+' L',iv.restore.length&&'road restoration ('+iv.restore.length+')'].filter(Boolean).join(', ')||'none'}
function vIv(){const s0=scen(IV0()),b=nb(),A=cur(),iv=S.iv,bl=s0.vs.filter(v=>!v.open),rk=ivRank(),bt=(l,on,fn)=>`<button class="btn ${on?'':'sec'}" onclick="${fn}">${l}</button> `;
 return `<div class="card"><h3>Strategic Decision Simulator <span class="note">– combine interventions; they apply to the whole plan</span></h3>
 <p>${bt('Additional truck',iv.truck,'S.iv.truck=S.iv.truck?0:S.tc;R()')} capacity (kg) <input type="number" value="${S.tc}" onchange="S.tc=Math.max(0,+this.value);if(S.iv.truck)S.iv.truck=S.tc;R()"></p>
 <p>Food: ${[0,50,100,200].map(x=>bt(x?'+'+x:'none',iv.food==x,'S.iv.food='+x+';R()')).join('')}</p><p>Water: ${[0,100,200,300].map(x=>bt(x?'+'+x+' L':'none',iv.water==x,'S.iv.water='+x+';R()')).join('')}</p>
 <p>Road restoration: ${bl.length?bl.map(v=>bt(v.name,iv.restore.includes(v.id),`tgR('${v.id}')`)).join(''):'<span class="note">no blocked villages</span>'}</p><button class="btn sec" onclick="S.iv=IV0();R()">Clear interventions</button> Objective: <select onchange="S.obj=this.value;R()">${Object.keys(OBJ).map(k=>`<option value="${k}" ${S.obj==k?'selected':''}>${OBJ[k][0]}</option>`).join('')}</select></div>
 <div class="grid g6" style="margin-top:12px"><div class="card kpi"><b>${b.cov.toFixed(1)}% → ${A.cov.toFixed(1)}%</b><span>Fulfillment (original → new)</span></div><div class="card kpi"><b>${b.cu-A.cu}</b><span>Critical unmet units reduced</span></div><div class="card kpi"><b>${(A.vulC-b.vulC).toFixed(0)}</b><span>Extra vulnerable covered (est.)</span></div><div class="card kpi"><b style="font-size:15px">${req(iv)}</b><span>Additional resources required</span></div></div>
 <div class="card" style="margin-top:12px"><h3>Original vs new allocation (food / water)</h3><div class="wrap"><table><tr><th>Village</th><th>Original</th><th>New</th><th>Change</th></tr>${A.rows.map(a=>{const o=b.rows.find(x=>x.v.id==a.v.id),d=a.f+a.w-(o?o.f+o.w:0);return `<tr><td>${a.v.name}</td><td>${o?o.f+' / '+o.w:'–'}</td><td>${a.f} / ${a.w}</td><td class="${d>0?'up':d<0?'dn':''}">${d>0?'▲ +':d<0?'▼ ':''}${d||'–'}</td></tr>`}).join('')}</table></div></div>
 <div class="card" style="margin-top:12px"><h3>Which intervention creates the greatest humanitarian impact?</h3><p><b>${rk[0].d>1e-9?'Highest impact on “'+OBJ[S.obj][0]+'”: '+rk[0].n:'No single intervention improves “'+OBJ[S.obj][0]+'” in the current scenario.'}</b></p><div class="wrap"><table><tr><th>#</th><th>Intervention (tested alone)</th><th>Δ fulfillment</th><th>Critical unmet reduced</th><th>Vulnerable covered (est.)</th><th>Needs</th></tr>${rk.map((c,i)=>`<tr><td>${i+1}</td><td>${c.n}</td><td class="${c.A.cov-c.b.cov>0?'up':''}">${(c.A.cov-c.b.cov).toFixed(1)} pts</td><td>${c.b.cu-c.A.cu}</td><td>${(c.A.vulC-c.b.vulC).toFixed(0)}</td><td>${c.rq}</td></tr>`).join('')}</table></div><div class="note">Measured with the ${S.method=='opt'?'optimized':'greedy'} strategy against the current scenario without interventions. No monetary costs are assumed.</div></div>`}
function tgR(id){const r=S.iv.restore,i=r.indexOf(id);i<0?r.push(id):r.splice(i,1);R()}
function vWhy(){const P=cur(),bind=[];if(P.F<=0)bind.push('food stock was exhausted');if(P.W<=0)bind.push('water stock was exhausted');if(P.st.cap-P.kgUsed<1)bind.push('truck capacity ('+P.st.cap+' kg) was fully used');
 return `<div class="card"><h3>Why ReliefReady made this decision <span class="note">– ${S.method=='opt'?'Optimized':'Greedy'} strategy, generated from live calculations</span></h3>${P.rows.map(r=>{const v=r.v,fs=v.food-r.f,ws=v.water-r.w;
  const why=!v.open?'its road is blocked, so it cannot receive a normal truck delivery':r.status=='Fully Fulfilled'?'its road is accessible and sufficient stock and truck capacity were available':(bind.length?bind.join(' and '):'higher-priority needs absorbed the stock')+(S.method=='opt'?'; the optimizer accepted this shortage because it lowers the total weighted shortage':'; villages ranked above it were served first');
  return `<div style="padding:9px 0;border-bottom:1px solid var(--bd)"><b>#${r.rank} ${v.name}</b> ${pill(r.status)}<br>${v.name} received ${r.f} of ${v.food} food packets and ${r.w} of ${v.water} litres of water because it has ${v.urg.toLowerCase()} urgency (priority ${r.score.toFixed(1)}), ${v.pop} affected residents and ${v.vul} vulnerable people. Road: ${v.open?'accessible':'blocked'}. Explanation: ${why}. Remaining shortage: ${fs} packets, ${ws} L.</div>`}).join('')}</div>`}
const DEMO=[['The disaster situation',()=>{S.view='Overview'}],['Villages and priority ranking',()=>{S.view='Overview'}],['Greedy allocation',()=>{S.method='greedy';S.gen=true;S.view='Resource Allocation'}],['Optimized allocation',()=>{S.method='opt';S.view='Resource Allocation'}],['Compare the strategies',()=>{S.view='Strategy Comparison'}],['Vulnerable population coverage',()=>{S.view='Humanitarian Impact'}],['Blocked-road scenario',()=>{S.sc.road=true;S.view='Scenario Simulator'}],['New affected village',()=>{S.sc.new=true;S.view='Scenario Simulator'}],['Strategic Decision Simulator',()=>{S.view='Strategic Simulator'}],['Apply the top-ranked intervention',()=>{const t=ivRank()[0];if(t&&t.d>1e-9)S.iv=t.iv;S.view='Strategic Simulator'}],['Final impact report',()=>{S.view='Reports'}]];
function demoGo(i){rs();S.gen=true;for(let k=0;k<=i;k++)DEMO[k][1]();S.demo=i;R()}
function demoBar(){const i=S.demo;return `<div class="card" style="margin-bottom:12px;border-color:var(--b)"><b>Demo step ${i+1}/${DEMO.length}: ${DEMO[i][0]}</b> <span class="note">– runs on the live application state</span><br><button class="btn sec" onclick="demoGo(${Math.max(0,i-1)})">◀ Previous</button> <button class="btn" onclick="demoGo(${Math.min(DEMO.length-1,i+1)})">Next ▶</button> <button class="btn sec" onclick="S.demo=null;R()">Exit demo</button></div>`}
function stratBar(){return `<div class="note" style="margin-bottom:10px">Allocation strategy: <button class="btn ${S.method=='greedy'?'':'sec'}" onclick="S.method='greedy';R()">Greedy</button> <button class="btn ${S.method=='opt'?'':'sec'}" onclick="S.method='opt';R()">Optimized</button></div>`}
function recs(P){const bl=P.rows.filter(r=>!r.v.open);if(!bl.length)return '';const acc=P.rows.filter(r=>r.v.open);
 return `<div class="card" style="margin-top:12px"><h3>Recommended actions for inaccessible villages</h3>${bl.map(r=>{const v=r.v,n=acc.map(a=>({a,d:Math.hypot(a.v.x-v.x,a.v.y-v.y)})).sort((p,q)=>p.d-q.d)[0];return `<p><b>${v.name}</b> (${v.urg}, ${v.vul} vulnerable, requests ${v.food} packets / ${v.water} L)</p><ul><li><span class="pill ok">Feasible now</span> Plan a delivery for when access returns. ${P.F+P.W>0?P.F+' packets and '+P.W+' L are unallocated and can be earmarked.':'No stock is left, so a reserve would reduce other villages.'}</li><li><span class="pill High">Needs resources</span> Set up a temporary distribution point${n?' near '+n.a.v.name+' (closest accessible village on the simulated map)':''} and request an extra vehicle, because the current truck cannot reach ${v.name}.</li><li><span class="pill Medium">Hypothetical</span> Restore the road (test it in Strategic Simulator) or prioritize emergency transport for critical supplies. The simulated network has no alternative route.</li></ul>`}).join('')}</div>`}
function repExtra(P){const top=ivRank()[0],cu=P.rows.filter(r=>r.v.urg=='Critical'&&r.status!='Fully Fulfilled');
 return `<div class="card" style="margin-top:12px"><h3>Situation and decision summary</h3><ul><li>Strategy used: <b>${S.method=='opt'?'Optimized (exact integer optimizer)':'Greedy'}</b>; total weighted shortage ${P.ws.toFixed(3)}.</li><li>Truck utilization: ${P.kgUsed.toFixed(0)} of ${P.st.cap} kg (${(P.kgUsed/P.st.cap*100).toFixed(0)}%).</li><li>Vulnerable coverage (estimate): ${P.vulC.toFixed(0)} of ${P.vulT}.</li><li>Critical unmet needs: ${cu.length?cu.map(r=>r.v.name).join(', '):'none'}.</li><li>Active scenarios: ${Object.keys(S.sc).filter(k=>S.sc[k]).join(', ')||'none'}; baseline coverage ${base().cov.toFixed(1)}% vs current ${P.cov.toFixed(1)}%.</li><li>Recommended intervention: ${top&&top.d>1e-9?top.n:'none improves the chosen objective'}.</li></ul><p class="note">Simulation output for decision support. Not official or verified field data.</p></div>`}
function scen(iv){iv=iv||S.iv;
 let vs=JSON.parse(JSON.stringify(S.vs)),st={...S.st};
 if(S.sc.road){const b=vs.find(v=>v.id=='B');if(b)b.open=false}
 if(S.sc.new&&!vs.find(v=>v.id=='F'))vs.push({...NEWV});
 if(S.sc.flood){vs.forEach(v=>{v.food=Math.ceil(v.food*1.2);v.water=Math.ceil(v.water*1.2);v.vul=Math.ceil(v.vul*1.2)});vs.push({id:'G',name:'Chandrapura',pop:280,food:140,water:220,urg:'Critical',vul:50,dist:22,open:true,x:270,y:150},{id:'H',name:'Nadipura',pop:220,food:110,water:180,urg:'High',vul:45,dist:28,open:false,x:520,y:300})}
 if(S.sc.stock){st.food=250;st.water=350}
 iv.restore.forEach(id=>{const v=vs.find(x=>x.id==id);if(v)v.open=true});st.cap+=iv.truck;st.food+=iv.food;st.water+=iv.water;
 return{vs,st};
}
const base=m=>compute(S.vs,S.st,m||S.method),cur=m=>{const s=scen();return compute(s.vs,s.st,m||S.method)};
const pct=(a,b)=>b?Math.min(100,a/b*100):0,fp=r=>pct(r.f+r.w,r.v.food+r.v.water);
const pill=(t)=>`<span class="pill ${t.split(' ')[0]}">${t}</span>`;
const hb=(l,a,max,c,txt,b2,c2)=>`<div class="bar"><i>${l}</i><div><u style="width:${pct(a,max)}%;background:${c}"></u>${b2!=null?`<u style="width:${pct(b2,max)}%;background:${c2}"></u>`:''}</div><em>${txt}</em></div>`;
const UC={Critical:'#dc2626',High:'#f59e0b',Medium:'#2563eb',Low:'#16a34a'};

function mapSvg(P){
 const rows=P.rows;
 let s=`<svg viewBox="0 0 600 380" style="width:100%;background:var(--map);border-radius:10px"><text x="12" y="20" font-size="11" fill="var(--mut)">Fictional flood-affected district, Karnataka (simulated)</text><path d="M0 300 Q150 250 300 290 T600 270 V380 H0Z" fill="#2563eb" opacity=".15"/>`;
 rows.forEach(r=>{const v=r.v,c=v.open?'#16a34a':'#dc2626';s+=`<line x1="${DEPOT.x}" y1="${DEPOT.y}" x2="${v.x}" y2="${v.y}" stroke="${c}" stroke-width="3" ${v.open?'':'stroke-dasharray="7 5"'}/>`});
 rows.forEach(r=>{const v=r.v;s+=`<g style="cursor:pointer" onclick="selV('${v.id}')"><circle cx="${v.x}" cy="${v.y}" r="${8+v.pop/40}" fill="${UC[v.urg]}" stroke="${S.sel==v.id?'#111':'#fff'}" stroke-width="${S.sel==v.id?4:2}"/><text x="${v.x}" y="${v.y+4}" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">${v.id}</text><text x="${v.x}" y="${v.y-14-v.pop/40}" font-size="11" text-anchor="middle" fill="var(--tx)">${v.name}</text></g>`});
 s+=`<rect x="${DEPOT.x-14}" y="${DEPOT.y-9}" width="28" height="18" rx="4" fill="#0f1b33" stroke="#fff"/><text x="${DEPOT.x}" y="${DEPOT.y+4}" font-size="10" fill="#fff" text-anchor="middle">TRUCK</text><text x="${DEPOT.x}" y="${DEPOT.y+24}" font-size="10" text-anchor="middle" fill="var(--tx)">Relief depot</text>`;
 s+=`<g font-size="10" fill="var(--tx)"><line x1="400" y1="350" x2="425" y2="350" stroke="#16a34a" stroke-width="3"/><text x="430" y="353">Accessible</text><line x1="400" y1="365" x2="425" y2="365" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 3"/><text x="430" y="368">Blocked</text></g></svg>`;
 return s;
}
function detail(P){
 const r=P.rows.find(x=>x.v.id==S.sel)||P.rows[0],v=r.v;
 return `<h3>${v.name} (Village ${v.id}) ${pill(v.urg)}</h3><div class="note">Population ${v.pop} · Vulnerable ${v.vul} · ${v.dist} km · Road ${v.open?'<b class="up">Accessible</b>':'<b class="dn">Blocked</b>'}</div>
 <p>Requested: <b>${v.food}</b> food packets, <b>${v.water}</b> L water<br>Priority score <b>${r.score.toFixed(1)}</b> (rank #${r.rank})</p>${S.gen?`<p>Allocated: <b>${r.f}</b> packets, <b>${r.w}</b> L – ${pill(r.status)}</p>`:'<p class="note">Generate the allocation plan to see delivery.</p>'}`;
}
function why(r){const t=(n,l,w)=>`${l} ${n.toFixed(0)}×${w}=${(n*w).toFixed(1)}`;
 return `${t(r.u,'Urgency','0.4')} + ${t(r.p,'Population','0.3')} + ${t(r.q,'Vulnerable','0.3')} = <b>${r.score.toFixed(1)}</b>`}

function totals(P){return {pop:P.rows.reduce((a,r)=>a+r.v.pop,0),crit:P.rows.filter(r=>r.v.urg=='Critical').length}}
function vOverview(){const P=cur(),t=totals(P),cov=S.gen?P.cov:0;
 return `<div class="grid g6">${[['Affected population',t.pop],['Villages affected',P.rows.length],['Food packets available',P.st.food],['Drinking water (L)',P.st.water],['Critical villages',t.crit],['Relief coverage',cov.toFixed(1)+'%']].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Situation map</h3>${mapSvg(P)}</div><div class="card" id="det">${detail(P)}</div></div>
 <div class="card" style="margin-top:12px"><h3>Priority ranking <span class="note">– Score = 40% urgency + 30% population + 30% vulnerable (population values normalized to 0–100 against the largest village)</span></h3>${prioTable(P)}</div>`;
}
function prioTable(P){let rows=[...P.rows];
 if(S.sort=='name')rows.sort((a,b)=>a.v.name.localeCompare(b.v.name));
 return `<div class="wrap"><table><tr><th onclick="S.sort='score';R()" style="cursor:pointer">Rank ▼</th><th>Village</th><th>Urgency</th><th>Pop.</th><th>Vuln.</th><th>Score</th><th>Why this score</th></tr>${rows.map(r=>`<tr class="${S.sel==r.v.id?'sel':''}" onclick="selV('${r.v.id}')"><td>#${r.rank}</td><td>${r.v.name}</td><td>${pill(r.v.urg)}</td><td>${r.v.pop}</td><td>${r.v.vul}</td><td><b>${r.score.toFixed(1)}</b></td><td>${why(r)}</td></tr>`).join('')}</table></div><div class="note">Sort: <a href="#" onclick="S.sort='score';R();return false">by priority</a> · <a href="#" onclick="S.sort='name';R();return false">by name</a></div>`;
}
function vLive(){const P=cur();
 const inp=(i,k,v)=>`<input type="number" value="${v}" onchange="ed(${i},'${k}',this.value)">`;
 return `<div class="card"><h3>Editable village data <span class="note">(changes apply to the baseline; scenarios are layered on top)</span></h3><div class="wrap"><table><tr><th>Village</th><th>Pop.</th><th>Food req.</th><th>Water req.</th><th>Vulnerable</th><th>Km</th><th>Urgency</th><th>Road</th></tr>${S.vs.map((v,i)=>`<tr><td>${v.name}</td><td>${inp(i,'pop',v.pop)}</td><td>${inp(i,'food',v.food)}</td><td>${inp(i,'water',v.water)}</td><td>${inp(i,'vul',v.vul)}</td><td>${inp(i,'dist',v.dist)}</td><td><select onchange="ed(${i},'urg',this.value)">${Object.keys(URG).map(u=>`<option ${u==v.urg?'selected':''}>${u}</option>`).join('')}</select></td><td><select onchange="ed(${i},'open',this.value)"><option value="1" ${v.open?'selected':''}>Accessible</option><option value="0" ${v.open?'':'selected'}>Blocked</option></select></td></tr>`).join('')}</table></div></div>
 <div class="card" style="margin-top:12px"><h3>Stock &amp; truck</h3>Food packets <input type="number" value="${S.st.food}" onchange="S.st.food=+this.value;R()"> Water (L) <input type="number" value="${S.st.water}" onchange="S.st.water=+this.value;R()"> Truck capacity (kg) <input type="number" value="${S.st.cap}" onchange="S.st.cap=+this.value;R()"><div class="note">Load model: 1 food packet = 0.5 kg, 1 L water = 1 kg.</div></div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Live map</h3>${mapSvg(P)}</div><div class="card">${detail(P)}</div></div>`;
}
function allocTable(P){return `<div class="wrap"><table><tr><th>Village</th><th>Food req.</th><th>Food alloc.</th><th>Water req.</th><th>Water alloc.</th><th>Shortage (food / water)</th><th>Status</th></tr>${P.rows.map(r=>`<tr><td>#${r.rank} ${r.v.name}</td><td>${r.v.food}</td><td><b>${r.f}</b></td><td>${r.v.water}</td><td><b>${r.w}</b></td><td class="${r.v.food-r.f+r.v.water-r.w?'dn':''}">${r.v.food-r.f} / ${r.v.water-r.w}</td><td>${pill(r.status)}</td></tr>`).join('')}</table></div>`}
function vAlloc(){
 if(!S.gen)return `<div class="card"><h3>No plan yet</h3><p>Press <b>Generate Allocation Plan</b> to run the greedy allocator on the current scenario.</p></div>`;
 const P=cur(),R_=P.rows;
 return `<div class="card"><h3>Allocation table</h3>${allocTable(P)}</div>
 <div class="card" style="margin-top:12px"><h3>Why this allocation?</h3><ul><li>Villages are ranked by priority score; the allocator walks the list from the top and gives each reachable village <b>min(request, remaining stock)</b> of food and water.</li><li>Blocked roads are skipped (no alternative delivery assumed), so their share flows to the next-ranked villages.</li><li>Each load is checked against truck capacity (${P.st.cap} kg); used ${P.kgUsed.toFixed(0)} kg.</li><li>Critical or vulnerable-heavy villages score higher, so they are served first when stock is short.</li></ul>${R_.map(r=>`<div class="note"><b>#${r.rank} ${r.v.name}:</b> ${r.note}</div>`).join('')}</div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Available vs allocated</h3>${hb('Food packets',P.fa,P.st.food,'#16a34a',P.fa+' / '+P.st.food)}${hb('Water (L)',P.wa,P.st.water,'#2563eb',P.wa+' / '+P.st.water)}<h3 style="margin-top:14px">Fulfillment % by village</h3>${R_.map(r=>hb(r.v.name,fp(r),100,UC[r.v.urg],fp(r).toFixed(0)+'%')).join('')}</div>
 <div class="card"><h3>Distribution by village</h3><div class="note">Food packets (green) · Water litres (blue)</div>${R_.map(r=>hb(r.v.name,r.f,P.st.food,'#16a34a',r.f+' pk')+hb('',r.w,P.st.water,'#2563eb',r.w+' L')).join('')}<h3 style="margin-top:14px">Priority score</h3>${R_.map(r=>hb(r.v.name,r.score,100,'#f59e0b',r.score.toFixed(1))).join('')}</div></div>`;
}
function seq(P){const o=P.rows.filter(r=>r.v.open).sort((a,b)=>b.score-a.score||a.v.dist-b.v.dist);return o}
function vRoute(){const P=cur(),q=seq(P);
 const kg=P.rows.reduce((a,r)=>a+r.v.open?0:0,0);
 return `<div class="card"><h3>Road network</h3><div class="wrap"><table><tr><th>Village</th><th>Distance</th><th>Road</th><th>Load (kg)</th><th>Feasibility</th></tr>${P.rows.map(r=>{const kg=S.gen?r.f*.5+r.w:r.v.food*.5+r.v.water;return `<tr><td>${r.v.name}</td><td>${r.v.dist} km</td><td>${r.v.open?'<span class="pill ok">Accessible</span>':'<span class="pill bad">Blocked</span>'}</td><td>${kg.toFixed(0)}</td><td>${!r.v.open?'Not deliverable':kg<=P.st.cap?'Feasible in one trip':'Needs multiple trips'}</td></tr>`}).join('')}</table></div></div>
 <div class="card" style="margin-top:12px"><h3>Suggested delivery sequence</h3><ol>${q.map(r=>`<li><b>${r.v.name}</b> – priority ${r.score.toFixed(1)}, ${r.v.dist} km</li>`).join('')}</ol><p>Total one-way depot distances: <b>${q.reduce((a,r)=>a+r.v.dist,0)} km</b> · Truck capacity ${P.st.cap} kg · Planned load ${P.kgUsed.toFixed(0)} kg (${P.kgUsed<=P.st.cap?'within capacity':'over'}).</p><p class="note">Heuristic ordering by priority, then distance. This is not a globally optimal route (no routing optimization is run).</p></div>${recs(P)}`;
}
function diffs(B,N){const out=[];
 N.rows.forEach(n=>{const b=B.rows.find(x=>x.v.id==n.v.id);if(!b){out.push(`<b>${n.v.name}</b> is a new village, ranked #${n.rank}, receiving ${n.f} packets / ${n.w} L.`);return}
  const d=(n.f+n.w)-(b.f+b.w);if(d)out.push(`<b>${n.v.name}</b>: ${d>0?'+':''}${d} units (${b.f}/${b.w} → ${n.f}/${n.w})`)});return out}
function vSim(){
 const B=base(),N=cur(),sc=S.sc,on=k=>sc[k]?'act':'';
 let h=`<div class="card"><h3>Disaster Scenario Simulator</h3><button class="btn red ${on('road')}" onclick="tog('road')">1 · Blocked road (Rampura)</button> <button class="btn or ${on('new')}" onclick="tog('new')">2 · New village (Shivapura)</button> <button class="btn ${on('stock')}" onclick="tog('stock')">3 · Reduced stock (250 / 350)</button> <button class="btn red ${on('flood')}" onclick="tog('flood')">4 · Multi-village flood emergency</button> <button class="btn sec" onclick="reset()">Reset</button><div class="note">Scenarios stack. The baseline is the plan for the unmodified data.</div></div>`;
 const anyOn=sc.road||sc.new||sc.stock||sc.flood;
 if(!anyOn)return h+`<div class="card" style="margin-top:12px"><p>Baseline coverage is <b>${B.cov.toFixed(1)}%</b>. Trigger a scenario to see before-and-after comparisons.</p></div>`;
 const d=N.cov-B.cov,all=[...N.rows].sort((a,b)=>a.rank-b.rank);
 h+=`<div class="grid g6" style="margin-top:12px"><div class="card kpi"><b>${B.cov.toFixed(1)}%</b><span>Baseline coverage</span></div><div class="card kpi"><b>${N.cov.toFixed(1)}%</b><span>Scenario coverage</span></div><div class="card kpi"><b class="${d<0?'dn':'up'}">${d>0?'+':''}${d.toFixed(1)} pts</b><span>Change</span></div><div class="card kpi"><b class="${N.vulC<B.vulC?'dn':'up'}">${(N.vulC-B.vulC>0?'+':'')+(N.vulC-B.vulC).toFixed(0)}</b><span>Vulnerable covered (est.)</span></div><div class="card kpi"><b>${N.cu}</b><span>Critical unmet units (baseline ${B.cu})</span></div></div>
 <div class="card" style="margin-top:12px"><h3>Before vs after</h3><div class="wrap"><table><tr><th>Village</th><th>Baseline (food/water)</th><th>Scenario (food/water)</th><th>Change</th><th>Fulfillment</th><th>Status</th></tr>${all.map(n=>{const b=B.rows.find(x=>x.v.id==n.v.id),bu=b?b.f+b.w:0,dl=n.f+n.w-bu;return `<tr><td>#${n.rank} ${n.v.name}${b?'':' <span class="pill Medium">NEW</span>'}</td><td>${b?b.f+' / '+b.w:'–'}</td><td>${n.f} / ${n.w}</td><td class="${dl>0?'up':dl<0?'dn':''}">${dl>0?'▲ +':dl<0?'▼ ':''}${dl||'–'}</td><td>${b?fp(b).toFixed(0)+'% → ':''}${fp(n).toFixed(0)}%</td><td>${pill(n.status)}</td></tr>`}).join('')}</table></div></div>
 <div class="card" style="margin-top:12px"><h3>Why did the allocation change?</h3><ul>${sc.road?`<li>Rampura’s road is blocked, so its request is skipped and the stock is passed down the priority list.</li>`:''}${sc.new?`<li>Shivapura (350 people, 60 vulnerable, Critical) enters the ranking. Normalization now uses 350 as the largest population, so every score shifts.</li>`:''}${sc.flood?`<li>Flood emergency adds two villages, raises existing demand and vulnerable counts by 20%, and blocks one new road, so all priority scores shift.</li>`:''}${sc.stock?`<li>Stock drops to 250 packets / 350 L, so lower-ranked villages are cut first.</li>`:''}${diffs(B,N).map(x=>`<li>${x}</li>`).join('')||'<li>No village allocation changed.</li>'}</ul></div>`;
 return h;
}
function csv(){const P=cur();const L=[['Rank','Village','Urgency','Priority','Food Requested','Food Allocated','Water Requested','Water Allocated','Food Shortage','Water Shortage','Status']];
 P.rows.forEach(r=>L.push([r.rank,r.v.name,r.v.urg,r.score.toFixed(1),r.v.food,r.f,r.v.water,r.w,r.v.food-r.f,r.v.water-r.w,r.status]));return L.map(a=>a.join(',')).join('\n')}
function exp(){const t=csv();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='reliefready_report.csv';a.click()}catch(e){}$('csvbox').style.display='block';$('csvbox').value=t}
function vReport(){
 if(!S.gen)return `<div class="card"><p>Generate an allocation plan first.</p></div>`;
 const P=cur(),c=s=>P.rows.filter(r=>r.status.startsWith(s));
 const cu=P.rows.filter(r=>r.v.urg=='Critical'&&r.status!='Fully Fulfilled');
 return `<div class="card"><h3>Summary report</h3><div class="grid g6"><div class="card kpi"><b>${P.st.food} / ${P.st.water}</b><span>Available food / water</span></div><div class="card kpi"><b>${P.fa} / ${P.wa}</b><span>Allocated</span></div><div class="card kpi"><b>${P.F} / ${P.W}</b><span>Remaining</span></div></div>
 <ul><li>Fully served (${c('Fully').length}): ${c('Fully').map(r=>r.v.name).join(', ')||'none'}</li><li>Partially served (${c('Partially').length}): ${c('Partially').map(r=>r.v.name).join(', ')||'none'}</li><li>Not served (${c('Unmet').length+c('Delivery').length}): ${[...c('Unmet'),...c('Delivery')].map(r=>r.v.name).join(', ')||'none'}</li><li>Critical unmet needs: ${cu.map(r=>`${r.v.name} (${r.v.food-r.f} packets, ${r.v.water-r.w} L short)`).join('; ')||'none'}</li></ul>
 <button class="btn" onclick="exp()">Export Report (CSV)</button> <button class="btn sec" onclick="window.print()">Print report</button><div class="note">If the download is blocked in this viewer, copy the CSV below.</div><textarea id="csvbox" style="display:none;margin-top:8px" readonly></textarea></div><div class="card" style="margin-top:12px"><h3>Allocation detail</h3>${allocTable(P)}</div>${repExtra(P)}`;
}
const VIEWS={'Overview':vOverview,'Live Situation':vLive,'Resource Allocation':vAlloc,'Route Management':vRoute,'Scenario Simulator':vSim,'Strategy Comparison':vCmp,'Humanitarian Impact':vEq,'Strategic Simulator':vIv,'Why This Decision':vWhy,'Reports':vReport};
